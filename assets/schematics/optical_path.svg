<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#0a0c10; font-family:'JetBrains Mono', 'SF Pro Display', sans-serif;">
  <defs>
    <linearGradient id="laserBeam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7b61ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#4000c0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#200060" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="fluoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#cc0044" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#880022" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Title -->
  <text x="50" y="50" fill="#00e5a0" font-size="20" font-weight="700">QORA-1 OPTICAL RESONANCE PATH &amp; BIO-CHAMBER</text>
  <text x="50" y="75" fill="#8b949e" font-size="12">CROSS-SECTION OF BIO-FLUORESCENCE EXCITATION, STOKES SHIFT, AND SPECTROMETRY</text>

  <!-- Center Cross-Section -->
  <g transform="translate(400, 120)">
    <!-- Quartz Cuvette Outer Walls -->
    <rect x="-35" y="0" width="70" height="340" rx="8" fill="none" stroke="#58a6ff" stroke-width="2.5" opacity="0.8"/>
    <rect x="-30" y="5" width="60" height="330" rx="5" fill="#0d1b2a" opacity="0.6"/>

    <!-- Chlorophyll Fluid Fill -->
    <rect x="-30" y="40" width="60" height="290" rx="4" fill="#003820" opacity="0.7"/>

    <!-- Laser Beam (405nm excitation upward) -->
    <polygon points="-8,340 8,340 4,40 -4,40" fill="url(#laserBeam)"/>
    <line x1="0" y1="340" x2="0" y2="40" stroke="#a371f7" stroke-width="2" opacity="0.9"/>

    <!-- Stokes Shift Ruby Fluorescence Cloud -->
    <ellipse cx="0" cy="220" rx="26" ry="70" fill="url(#fluoGlow)"/>

    <!-- Bottom Laser Module -->
    <g transform="translate(0, 360)">
      <rect x="-20" y="0" width="40" height="50" rx="3" fill="#21262d" stroke="#7b61ff" stroke-width="1.5"/>
      <text x="0" y="30" fill="#bc8cff" font-size="10" text-anchor="middle" font-weight="600">405nm LD</text>
      <!-- Focusing Collimator Lens -->
      <path d="M -15 0 Q 0 -6 15 0" stroke="#58a6ff" stroke-width="3" fill="none"/>
    </g>

    <!-- 90 Degree Spectrometer Path -->
    <line x1="0" y1="220" x2="160" y2="220" stroke="#ff4466" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="150,216 160,220 150,224" fill="#ff4466"/>

    <!-- Optical Slit / Baffle -->
    <rect x="110" y="195" width="6" height="50" fill="#30363d"/>
    <rect x="110" y="215" width="6" height="10" fill="#0a0c10"/> <!-- aperture -->

    <!-- Long-pass filter (blocks 405nm, passes >650nm) -->
    <line x1="130" y1="205" x2="130" y2="235" stroke="#f0883e" stroke-width="4"/>
    <text x="130" y="195" fill="#f0883e" font-size="9" text-anchor="middle">OG590 Filter</text>

    <!-- AS7341 Sensor Module -->
    <g transform="translate(160, 195)">
      <rect width="70" height="50" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
      <text x="35" y="22" fill="#58a6ff" font-size="10" text-anchor="middle" font-weight="600">AS7341</text>
      <text x="35" y="38" fill="#8b949e" font-size="9" text-anchor="middle">11-CH SPECT</text>
    </g>

    <!-- Light Guides to FMO Lattice -->
    <g stroke="#00e5a0" stroke-width="1.5" stroke-dasharray="3,3" fill="none">
      <path d="M -30 180 C -80 180, -100 140, -140 120"/>
      <circle cx="-140" cy="120" r="8" fill="#00e5a0" opacity="0.8"/>
      
      <path d="M -30 220 C -80 220, -120 230, -150 250"/>
      <circle cx="-150" cy="250" r="8" fill="#00e5a0" opacity="0.8"/>

      <path d="M -30 260 C -70 270, -90 320, -120 330"/>
      <circle cx="-120" cy="330" r="8" fill="#00e5a0" opacity="0.8"/>
    </g>

    <!-- Labels -->
    <text x="-45" y="15" fill="#58a6ff" font-size="11" text-anchor="end">Quartz Glass (25mm OD)</text>
    <text x="-45" y="100" fill="#2ea043" font-size="11" text-anchor="end">Chlorophyll-a Solution</text>
    <text x="-45" y="220" fill="#ff4466" font-size="11" text-anchor="end">Stokes Emission (~668nm)</text>
    <text x="-45" y="380" fill="#a371f7" font-size="11" text-anchor="end">Excitation Beam (405nm)</text>
    <text x="-160" y="125" fill="#00e5a0" font-size="11" text-anchor="end">FMO BCL-1 Node</text>
  </g>

  <!-- Wavelength / Spectral Profile Card (Right) -->
  <g transform="translate(680, 480)">
    <rect width="270" height="250" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="30" fill="#c9d1d9" font-size="13" font-weight="600">Spectral Shift Dynamics</text>
    <text x="20" y="55" fill="#a371f7" font-size="11">λ_in: 405nm (Soret Absorption Band)</text>
    <text x="20" y="75" fill="#ff4466" font-size="11">λ_out: 668nm (Qy Fluorescence Band)</text>
    <text x="20" y="95" fill="#00e5a0" font-size="11">ΔE (Stokes Shift): ~1.20 eV</text>

    <!-- Mini chart -->
    <line x1="20" y1="200" x2="250" y2="200" stroke="#484f58" stroke-width="1"/>
    <line x1="20" y1="120" x2="20" y2="200" stroke="#484f58" stroke-width="1"/>
    <!-- 405 peak -->
    <path d="M 40 200 Q 55 130 70 200" stroke="#a371f7" stroke-width="2" fill="none"/>
    <text x="55" y="215" fill="#a371f7" font-size="9" text-anchor="middle">405</text>
    <!-- 668 peak -->
    <path d="M 170 200 Q 200 140 230 200" stroke="#ff4466" stroke-width="2" fill="none"/>
    <text x="200" y="215" fill="#ff4466" font-size="9" text-anchor="middle">668nm</text>
    <text x="135" y="235" fill="#8b949e" font-size="10" text-anchor="middle">Wavelength (nm)</text>
  </g>

  <!-- Physical Dimensions Callout -->
  <g transform="translate(80, 500)">
    <rect width="280" height="230" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="30" fill="#ffffff" font-size="13" font-weight="600">Optics Mechanical Specs</text>
    <text x="20" y="60" fill="#8b949e" font-size="11">Cuvette Material: UV-grade fused quartz</text>
    <text x="20" y="80" fill="#8b949e" font-size="11">Outer Diameter: 25.0 mm ± 0.1mm</text>
    <text x="20" y="100" fill="#8b949e" font-size="11">Wall Thickness: 1.5 mm</text>
    <text x="20" y="120" fill="#8b949e" font-size="11">Height: 95.0 mm</text>
    <text x="20" y="140" fill="#8b949e" font-size="11">Sealing: Double Viton/Silicone O-rings</text>
    <text x="20" y="160" fill="#8b949e" font-size="11">Angle: 90° Orthogonal Detection</text>
    <text x="20" y="180" fill="#8b949e" font-size="11">Optical Fiber: 1.0mm PMMA Bare Fiber</text>
  </g>
</svg>
