<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" style="background:#0a0c10; font-family:'JetBrains Mono', monospace;">
  <defs>
    <style>
      .pin { font-size: 10px; fill: #58a6ff; }
      .label { font-size: 11px; fill: #c9d1d9; }
      .wire { stroke-width: 1.5; fill: none; }
      .gnd { stroke: #484f58; }
      .vcc { stroke: #f85149; }
      .sig { stroke: #00e5a0; }
    </style>
  </defs>

  <text x="40" y="45" fill="#00e5a0" font-size="18" font-weight="bold">QORA-1 ELECTRICAL WIRING &amp; PINOUT SCHEMATIC</text>
  <text x="40" y="70" fill="#8b949e" font-size="11">ESP32-S3 INTERFACE WITH AS7341, VL53L8CX, MAX98357A, SK6812 RGBW &amp; LASER DRIVER</text>

  <!-- ESP32-S3 Microcontroller Block (Center) -->
  <g transform="translate(380, 120)">
    <rect width="320" height="600" rx="8" fill="#161b22" stroke="#00e5a0" stroke-width="2"/>
    <text x="160" y="35" fill="#00e5a0" font-size="15" font-weight="bold" text-anchor="middle">ESP32-S3-WROOM-1</text>
    <text x="160" y="55" fill="#8b949e" font-size="10" text-anchor="middle">16MB FLASH / 8MB PSRAM</text>

    <!-- Left Pins -->
    <g class="pin">
      <text x="15" y="100">3V3 (POWER)</text>
      <text x="15" y="130">GND</text>
      <text x="15" y="170">GPIO 8 (I2C_SDA)</text>
      <text x="15" y="200">GPIO 9 (I2C_SCL)</text>
      <text x="15" y="240">GPIO 10 (AS7341_INT)</text>
      <text x="15" y="270">GPIO 11 (VL53_INT)</text>
      <text x="15" y="320">GPIO 1 (TOUCH_T1)</text>
      <text x="15" y="370">GPIO 2 (LASER_PWM)</text>
      <text x="15" y="420">GPIO 48 (LED_DATA)</text>
      <text x="15" y="470">GPIO 12 (I2S_BCLK)</text>
      <text x="15" y="500">GPIO 13 (I2S_LRCK)</text>
      <text x="15" y="530">GPIO 14 (I2S_DOUT)</text>
      <text x="15" y="570">5V (VBUS_IN)</text>
    </g>
  </g>

  <!-- Sensor Modules (Left) -->
  <!-- AS7341 -->
  <g transform="translate(60, 160)">
    <rect width="220" height="110" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="15" y="25" fill="#58a6ff" font-weight="bold" font-size="12">AS7341 Spectrometer</text>
    <text x="15" y="50" class="pin">VIN  — 3.3V (AP2112 LDO)</text>
    <text x="15" y="70" class="pin">GND  — Common Ground</text>
    <text x="15" y="90" class="pin">SDA/SCL — GPIO 8 / GPIO 9</text>
  </g>

  <!-- VL53L8CX ToF -->
  <g transform="translate(60, 290)">
    <rect width="220" height="110" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="15" y="25" fill="#58a6ff" font-weight="bold" font-size="12">VL53L8CX 8x8 ToF Sensor</text>
    <text x="15" y="50" class="pin">VIN  — 3.3V</text>
    <text x="15" y="70" class="pin">GND  — Common Ground</text>
    <text x="15" y="90" class="pin">SDA/SCL — GPIO 8 / GPIO 9 (Shared)</text>
  </g>

  <!-- Touch Electrode -->
  <g transform="translate(60, 420)">
    <rect width="220" height="80" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="15" y="25" fill="#d29922" font-weight="bold" font-size="12">Spun Brass Touch Ring</text>
    <text x="15" y="50" class="pin">Electrode → GPIO 1 (Touch 1)</text>
    <text x="15" y="68" fill="#8b949e" font-size="9">10pF filter cap to GND</text>
  </g>

  <!-- Actuator Modules (Right) -->
  <!-- MAX98357A & Dayton Audio Transducer -->
  <g transform="translate(790, 160)">
    <rect width="250" height="140" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
    <text x="15" y="25" fill="#f0883e" font-weight="bold" font-size="12">MAX98357A I2S Amplifier</text>
    <text x="15" y="50" class="pin">VIN  — 5V (USB-C Rail)</text>
    <text x="15" y="70" class="pin">BCLK — GPIO 12</text>
    <text x="15" y="90" class="pin">LRCK — GPIO 13</text>
    <text x="15" y="110" class="pin">DIN  — GPIO 14</text>
    <text x="15" y="130" fill="#f0883e" font-size="10">SPK+/- → Dayton Audio DAEX25 (4Ω)</text>
  </g>

  <!-- 24-Node SK6812 LED Array -->
  <g transform="translate(790, 320)">
    <rect width="250" height="120" rx="6" fill="#161b22" stroke="#00e5a0" stroke-width="1.5"/>
    <text x="15" y="25" fill="#00e5a0" font-weight="bold" font-size="12">24x SK6812 RGBW Matrix</text>
    <text x="15" y="50" class="pin">DIN  — GPIO 48 (via 330Ω)</text>
    <text x="15" y="70" class="pin">5V   — 5V Bus (Decoupled 1000uF)</text>
    <text x="15" y="90" class="pin">GND  — Ground</text>
    <text x="15" y="110" fill="#8b949e" font-size="9">Optically coupled to PMMA fiber</text>
  </g>

  <!-- 405nm Laser Driver -->
  <g transform="translate(790, 460)">
    <rect width="250" height="110" rx="6" fill="#161b22" stroke="#7b61ff" stroke-width="1.5"/>
    <text x="15" y="25" fill="#bc8cff" font-weight="bold" font-size="12">405nm Constant Current Driver</text>
    <text x="15" y="50" class="pin">PWM_IN — GPIO 2 (5kHz PWM)</text>
    <text x="15" y="70" class="pin">VCC    — 5V (Filtered)</text>
    <text x="15" y="90" class="pin">OUT+/- — Laser Diode (120mA max)</text>
  </g>

  <!-- Wiring connections -->
  <line x1="280" y1="210" x2="380" y2="210" class="wire sig"/>
  <line x1="280" y1="340" x2="380" y2="340" class="wire sig"/>
  <line x1="280" y1="460" x2="380" y2="440" class="wire" stroke="#d29922"/>

  <line x1="700" y1="480" x2="790" y2="230" class="wire" stroke="#f0883e"/>
  <line x1="700" y1="540" x2="790" y2="370" class="wire sig"/>
  <line x1="700" y1="490" x2="790" y2="510" class="wire" stroke="#7b61ff"/>
</svg>
